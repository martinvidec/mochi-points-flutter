name: e2e-web

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: e2e-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter-web-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Flutter Web
        # --no-tree-shake-icons is mandatory per CLAUDE.md because the app
        # loads some icons dynamically.
        run: flutter build web --release --no-tree-shake-icons

      - name: Install e2e dependencies
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Serve build/web and run Playwright
        working-directory: e2e
        env:
          E2E_BASE_URL: http://127.0.0.1:8080
          CI: 'true'
        run: |
          npx --yes serve -s ../build/web -l 8080 &
          SERVE_PID=$!
          trap "kill $SERVE_PID || true" EXIT
          for i in {1..60}; do
            if curl -sf http://127.0.0.1:8080 > /dev/null; then
              echo "server up"
              break
            fi
            sleep 1
          done
          npm test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14
